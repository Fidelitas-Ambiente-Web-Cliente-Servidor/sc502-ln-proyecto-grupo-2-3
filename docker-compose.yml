services:
  app:
    build:
      context: ./docker/php
    ports:
      - "${APP_PORT:-8081}:80"
    volumes:
      - ./:/var/www/html
      - parkeate_uploads:/var/www/html/uploads
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-parkeate}
      DB_USERNAME: ${MYSQL_USER:-parkeate_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-parkeate123}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - parkeate_network

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-parkeate}
      MYSQL_USER: ${MYSQL_USER:-parkeate_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-parkeate123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-parkeate_root_local}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - parkeate_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - parkeate_network

volumes:
  parkeate_mysql_data:
    name: parkeate_mysql_data
  parkeate_uploads:
    name: parkeate_uploads

networks:
  parkeate_network:
    name: parkeate_network
    driver: bridge
